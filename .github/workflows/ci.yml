name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fonts-dejavu-core
          uv sync --frozen --extra browser --python 3.13
          uv run playwright install --with-deps chromium-headless-shell
          echo "COMPANY_ENVS_BROWSER=$(uv run python scripts/browser_path.py)" >> "$GITHUB_ENV"
      - name: Lint
        run: uv run ruff check src scripts tests
      - name: Test
        run: uv run pytest -q
