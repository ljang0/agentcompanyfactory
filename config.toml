minimum_workers = 3
# Assign each task a distinct (app collections, decision type) cell before design.
feature_matrix = true
# Opt-in: the three-pair pilot did not establish a quality/efficiency gain.
# Joint portfolio-aware selection/design, captured evidence, bounded roster edits.
agency = false
read_only_tools = true
select_outlines = true
allow_amendment = false
review_separate_witness = true

# Per-app byte budgets, read by bulk_layer.max_bytes_for. A missing app takes the default above,
# so an app nobody has measured behaves exactly as it did before this table existed.
#
# HALF-WIRED until one more change lands: add-bulk reads this table, world_repair.lay_layers still
# re-lays every app under the default. A repair therefore drops slack back to 4500000 and puts
# robinhood back up to it. The three-line change is written out and handed to the coordinator.
#
# Two different constraints set these, and they have different remedies:
#   quota  -- the browser's 5 MiB of localStorage per origin. Harmless for 25 of the 26 apps
#             measured: they gate their fetch on the state key, find it absent and re-read the
#             server. Not harmless for google_docs_mock, which is why its ceiling is not here but
#             in bulk_layer.HARD_MAX_BYTES, where a config edit cannot raise it.
#   clock  -- page render time. Most apps virtualise and cost nothing extra to 12 MB. gmail_mock
#             renders the whole mailbox and costs about +3 s of page load per MB, so its 6 MB is
#             bought against the 25-minute per-worker episode, not against storage. Raising it
#             takes minutes out of every episode that opens a mailbox.
# A value *below* the default is not a ceiling at all: it is an app the generator was over-seeding
# because the skill tells it to spend whatever budget it is given. Lowering one means the next
# add-bulk --again or world repair lays fewer records than the world holds today.
[design.bulk_max_bytes_by_app]
slack_mock           = 8000000   # clean to 12.28 MB; a 40-person quarter would be 15.3 MB, so still a window
google_drive_mock    = 8000000   # clean to 12.11 MB; a department drive is 9-90 MB, so still a window
shopify_admin_mock   = 8000000   # clean to 11.99 MB; a merchant year is ~51 MB, so still a window
gmail_mock           = 6000000   # clock, not quota: storage-clean to 12.07 MB, but ~+3 s per MB per page load
google_calendar_mock = 2500000   # realistic volume: 40 people for half a year is 2.2 MB
trello_mock          = 2500000   # realistic volume: a real board holds 200-2,000 cards
robinhood_mock       = 1000000   # realistic volume: an account's alerts are hundreds, not 5,017

[models]
discover = ["codex/gpt-6-astra"]
research = ["codex/gpt-6-astra"]
expand = ["codex/gpt-6-astra"]
review = ["codex/gpt-6-astra"]
# Stage 2 world states: one call per company writes world/<app>.state.json, identities and materials.
world_states = ["codex/gpt-6-astra"]
world_review = ["codex/gpt-6-astra"]
reasoning = "high"
# Codex service tier for every pipeline call: "fast" for throughput, "default" otherwise.
service_tier = "default"  # fast tier turned off 2026-09-09 (user request)
review_policy = "fresh_session"
# Logged-in Codex account directories; calls rotate across them so concurrent
# jobs spread over both quotas. Directories without auth.json are skipped.
codex_homes = ["~/.codex-b"]  # ~/.codex hit its weekly limit; returns Sep 15 17:11 — re-add then

[diversity]
model = "sentence-transformers/all-mpnet-base-v2"
# Resolved to an immutable Hugging Face revision by bootstrap, then frozen per run.
revision = "main"
neighbors = 10
cross_run = true

[worker_policy]
seconds = 1500  # per worker; the episode step budget (run-company --seconds) still caps it
actions = 150
# No-hint worker policies that each get a graded episode after the teacher passes, in order;
# every policy after the first starts from a fresh session (one more reset + launch of VM time).
# "own" is our WorkerPolicy; another name X loads company_envs.world.policies.X.XPolicy.
policies = ["own"]
# policies = ["own", "macu"]  # add the MACU-style manager/worker adapter (policies/macu.py) for a comparison run
# These are no-hint policies and they label difficulty; a second harness here also catches
# environment faults a single teacher pass hides, which is why more than one is worth the VM time.
# Hint runs are different: the teacher is the pipeline's one hint run because delivery is defined on
# it. Any further hint run collects demonstrations, which happens after delivery in
# company_envs.world.benchmark, never as a pipeline stage. MacuPolicy refuses insider references for
# this reason, so it cannot be made a hint policy by configuration alone.
